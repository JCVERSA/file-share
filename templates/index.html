<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b1011">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1011;
      --panel: #10191b;
      --panel2: #142022;
      --panel3: #0e1718;
      --border: #263737;
      --border-strong: #405554;
      --text: #f4f7f4;
      --muted: #b0bcb8;
      --soft: #d1d9d5;
      --accent: #a2e3cb;
      --accent-strong: #7dd5b5;
      --success: #8fe0bb;
      --danger: #f28b82;
      --warning: #efcb8c;
      --shadow: 0 18px 54px rgba(0,0,0,.24);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5; }
    a { color:inherit; text-decoration:none; }
    button, input { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; }
    .page { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:24px 0 max(34px,env(safe-area-inset-bottom)); }
    .shell { background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
    .topbar { min-height:56px; padding:0 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; }
    .brand { color:var(--text); font-weight:700; letter-spacing:.01em; }
    .content { padding:28px; }
    .eyebrow { font-size:12px; letter-spacing:.01em; color:var(--muted); font-weight:650; margin-bottom:6px; }
    h1 { margin:0; font-size:clamp(30px,5vw,44px); line-height:1.06; letter-spacing:-.04em; text-wrap:balance; }
    h2 { margin:0; font-size:20px; letter-spacing:-.02em; text-wrap:balance; }
    .skip-link { position:fixed; top:12px; left:12px; z-index:2000; padding:10px 14px; background:var(--accent); color:#0a1713; border-radius:8px; font-weight:700; transform:translateY(-160%); transition:transform .15s ease; }
    .skip-link:focus-visible { transform:translateY(0); }
    .muted { color:var(--muted); }
    .hero { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .fs-title-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .fs-hero-copy { min-width:0; }
    .hero .muted { margin:9px 0 0; font-size:13px; overflow-wrap:anywhere; }
    .fs-online { display:inline-flex; align-items:center; gap:8px; min-height:34px; padding:6px 10px; border:1px solid rgba(143,224,187,.28); border-radius:999px; color:var(--success); font-size:11px; font-weight:700; }
    .status-dot { width:8px; height:8px; border-radius:999px; background:var(--success); flex:0 0 auto; }
    .fs-header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .fs-share-card { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:17px 18px; margin-bottom:18px; background:var(--panel3); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; }
    .fs-share-copy { min-width:0; }
    .fs-share-url { color:var(--text); font:13px ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .fs-share-meta { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    .fs-share-meta span + span { padding-left:12px; border-left:1px solid var(--border-strong); }
    .fs-share-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    .toolbar { display:grid; grid-template-columns:minmax(220px,.9fr) minmax(0,1.1fr); align-items:center; gap:14px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border); }
    .search-wrap input { width:100%; min-height:42px; padding:10px 13px; border:1px solid var(--border); border-radius:9px; background:var(--panel3); color:var(--text); }
    .search-wrap input:focus { border-color:var(--border-strong); }
    .search-wrap input:focus-visible { border-color:var(--accent); }
    .filter-group { display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end; }
    .filter,.ghost,.primary { min-height:40px; border-radius:8px; padding:8px 12px; border:1px solid var(--border); font-weight:650; font-size:12px; transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .12s ease; }
    .filter { background:transparent; color:var(--muted); }
    .filter:hover,.ghost:hover { background:#1a2929; border-color:var(--border-strong); color:var(--text); }
    .filter.active { background:rgba(162,227,203,.12); border-color:var(--accent-strong); color:var(--accent); }
    .primary { background:var(--accent); border-color:var(--accent); color:#0a1713; }
    .primary:hover { background:#b8efd9; border-color:#b8efd9; }
    .ghost { background:transparent; color:var(--soft); }
    .small { min-height:36px; padding:7px 10px; }
    .fs-action-btn { min-width:88px; }
    .fs-lock-btn { min-height:38px; padding:8px 12px; }
    .fs-library-head { display:flex; justify-content:space-between; align-items:center; gap:15px; margin:8px 0 12px; }
    .fs-library-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    .fs-refresh-btn { font-family:inherit; font-size:12px; background:var(--panel2); color:var(--soft); padding:8px 12px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:1px solid var(--border); border-radius:8px; font-weight:650; min-height:40px; transition:background-color .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease; }
    .fs-refresh-btn:hover { background:#1a2929; border-color:var(--border-strong); color:var(--text); }
    .fs-refresh-btn:active { transform:translateY(1px); }
    .fs-refresh-btn:disabled { cursor:wait; opacity:.7; }
    .fs-refresh-btn svg { display:block; width:18px; height:18px; color:currentColor; transform-origin:center; }
    .fs-refresh-btn.is-refreshing svg { animation:fs_spin .8s linear infinite; }
    @keyframes fs_spin { to { transform:rotate(360deg); } }
    .fs-library-title { font-size:13px; color:var(--soft); }
    .fs-library-title strong { color:var(--text); font-size:16px; font-variant-numeric:tabular-nums; }
    .file-list { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .file-row { position:relative; display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:13px; align-items:center; padding:14px; background:var(--panel2); border-bottom:1px solid var(--border); }
    .file-row:last-child { border-bottom:0; }
    .file-row:hover { background:#192727; }
    .file-icon { width:36px; height:36px; border-radius:8px; border:1px solid var(--border); display:grid; place-items:center; color:var(--muted); font-size:9px; font-weight:750; letter-spacing:.02em; overflow:hidden; }
    .file-main { min-width:0; }
    .file-main strong { display:block; font-size:14px; font-weight:650; overflow-wrap:anywhere; }
    .file-main span { display:block; color:var(--muted); font-size:12px; margin-top:4px; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }

    .fs-download-btn { display:inline-flex; align-items:center; justify-content:center; min-width:112px; min-height:40px; padding:0 14px; border:1px solid rgba(162,227,203,.42); border-radius:8px; background:rgba(162,227,203,.08); color:var(--accent); font-size:12px; font-weight:700; transition:background-color .15s ease,border-color .15s ease,color .15s ease; }
    .fs-download-btn:hover { background:var(--accent); border-color:var(--accent); color:#0a1713; }

    .fs-loading { display:flex; align-items:center; justify-content:center; gap:10px; min-height:42px; padding:10px 0; color:var(--muted); font-size:12px; }
    .fs-spinner { width:15px; height:15px; border:2px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:fs_spin .8s linear infinite; }

    .file-skeleton { position:relative; display:grid; grid-template-columns:44px minmax(0,1fr) 12px; gap:13px; align-items:center; padding:14px; border-bottom:1px solid var(--border); background:var(--panel2); }
    .file-skeleton:last-child { border-bottom:0; }
    .file-skeleton-icon { width:36px; height:36px; border-radius:8px; background:#263334; }
    .file-skeleton-main { min-width:0; }.file-skeleton-line { height:10px; background:#263334; border-radius:999px; margin:4px 0; }.file-skeleton-line.wide{width:56%}.file-skeleton-line.medium{width:42%}.file-skeleton-line.short{width:32%}.file-skeleton-dot{width:8px;height:8px;border-radius:50%;background:#263334;justify-self:end}

    .fs-transfer-btn { font-family:inherit; font-size:12px; background:var(--panel2); color:var(--soft); padding:9px 12px 9px 10px; display:inline-flex; align-items:center; gap:6px; cursor:default; border:1px solid var(--border); border-radius:8px; font-weight:650; min-width:150px; justify-content:flex-start; }
    .fs-transfer-btn .fs-svg-wrapper { display:inline-flex; align-items:center; justify-content:center; width:24px; min-width:24px; }
    .fs-transfer-btn svg { width:20px; height:20px; display:block; color:var(--accent); }

    /* Completion checkbox, scoped from the supplied checkbox component. */
    .fs-checkbox { --checkbox-color:#e8e9eb; --checkbox-size:1.35rem; display:inline-flex; align-items:center; position:relative; cursor:default; user-select:none; font-size:var(--checkbox-size); font-weight:700; color:var(--checkbox-color); }
    .fs-checkbox input { position:absolute; pointer-events:none; inset:0; opacity:0; }
    .fs-checkbox .checkmark { display:flex; align-items:center; gap:8px; opacity:.68; transition:opacity 150ms ease; }
    .fs-checkbox input:checked ~ .checkmark { opacity:1; }
    .fs-checkbox .checkmark svg { width:var(--checkbox-size); height:var(--checkbox-size); }
    .fs-checkbox .checkmark svg rect { stroke-dasharray:88 0; stroke-dashoffset:73; transition:stroke-dasharray 180ms ease; }
    .fs-checkbox input:checked ~ .checkmark svg rect { stroke-dasharray:80 18; }
    .fs-checkbox .checkmark svg polyline { stroke-dasharray:0 30; stroke-dashoffset:1; transition:stroke-dasharray 180ms ease; }
    .fs-checkbox input:checked ~ .checkmark svg polyline { stroke-dasharray:30 30; }
    .fs-transfer-status { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:10px; }
    .fs-transfer-copy { min-width:0; }
    .fs-transfer-copy strong { display:block; font-size:12px; }
    .fs-transfer-copy span { display:block; color:var(--muted); font-size:10px; margin-top:3px; }
    .fs-transfer-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    .fs-download-all { display:inline-flex; align-items:center; justify-content:center; min-width:136px; min-height:40px; padding:8px 15px; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#0a1713; font-size:12px; font-weight:700; transition:background-color .15s ease,border-color .15s ease,transform .12s ease; }
    .fs-download-all:hover { background:#b8efd9; border-color:#b8efd9; }
    .fs-download-all:active { transform:translateY(1px); }
    .fs-download-all:disabled { cursor:not-allowed; opacity:.62; }

    .button.fs-stop-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:38px; padding:8px 12px; border:1px solid rgba(242,139,130,.38); border-radius:8px; background:transparent; color:var(--danger); font:inherit; font-size:12px; font-weight:650; transition:background-color .15s ease,border-color .15s ease; }
    .button.fs-stop-btn:hover { background:rgba(242,139,130,.1); border-color:var(--danger); }
    .fs-stop-icon { font-size:17px; line-height:1; color:currentColor; }

    .progress-card { margin:14px 0; padding:15px; border:1px solid var(--border); background:var(--panel3); border-radius:10px; }
    .progress-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:9px; font-size:12px; font-variant-numeric:tabular-nums; }
    .progress-track { height:7px; background:#273435; border-radius:999px; overflow:hidden; }
    .progress-bar { height:100%; width:0; background:var(--accent); transition:width .12s linear; }
    .progress-card .small { margin-top:10px; }
    .qr-panel { display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; padding:16px; margin-bottom:16px; border:1px solid var(--border); background:var(--panel3); border-radius:10px; }
    #qrCanvas { width:min(220px,45vw); height:auto; background:#fff; padding:8px; border-radius:8px; justify-self:end; }
    .empty { padding:28px; border:1px dashed var(--border-strong); border-radius:10px; color:var(--muted); text-align:center; }
    .upload-note { margin:7px 0 12px; color:var(--muted); font-size:12px; }
    .progress-card[hidden],.upload-note[hidden] { display:none!important; }

    .fs-github-link { display:inline-flex; align-items:center; min-height:36px; padding:7px 0; color:var(--soft); font-size:12px; font-weight:650; text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:4px; }
    .fs-github-link:hover { color:var(--accent); text-decoration-color:currentColor; }
    .fs-footer { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:14px 20px 16px; border-top:1px solid var(--border); }
    .fs-footer-note { color:var(--muted); font-size:12px; }
    .fs-confirm { position:fixed; inset:0; display:grid; place-items:center; padding:20px; background:rgba(0,0,0,.72); backdrop-filter:blur(4px); z-index:1000; overscroll-behavior:contain; }
    .fs-confirm-card { width:min(420px,100%); padding:22px; border:1px solid var(--border-strong); border-radius:12px; background:var(--panel); box-shadow:var(--shadow); }
    .fs-confirm-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

    .auth-card { width:min(450px,100%); margin:52px auto; }
    .auth-card p { margin:10px 0 0; font-size:14px; }
    .auth-form { margin-top:23px; display:grid; gap:9px; }
    label { color:var(--soft); font-size:12px; }
    .auth-form input { width:100%; min-height:46px; padding:12px 14px; border:1px solid var(--border); border-radius:9px; background:var(--panel3); color:var(--text); }
    .auth-form input:focus { border-color:var(--border-strong); }
    .auth-form button { min-height:44px; margin-top:7px; padding:10px 15px; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#0a1713; font-weight:700; transition:background-color .15s ease,border-color .15s ease; }
    .auth-form button:hover { background:#b8efd9; border-color:#b8efd9; }
    .back { display:inline-block; margin-top:17px; color:var(--soft); font-size:12px; }
    footer { padding:13px 0 0; color:var(--muted); font-size:11px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    [hidden] { display:none!important; }
    a:focus-visible,button:focus-visible,input:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .fs-checkbox:focus-within .checkmark { outline:3px solid var(--accent); outline-offset:4px; border-radius:7px; }
    button:disabled { cursor:not-allowed; opacity:.62; }

    @media (max-width:760px) {
      .page { width:min(100% - 16px,1080px); padding-top:10px; }
      .content { padding:20px; }
      .hero,.fs-share-card { flex-direction:column; align-items:stretch; }
      .fs-header-actions,.fs-share-actions { justify-content:flex-start; }
      .fs-share-card { gap:14px; }
      .toolbar { grid-template-columns:1fr; gap:10px; }
      .filter-group { justify-content:flex-start; }
      .fs-library-head { align-items:flex-start; flex-direction:column; }
      .fs-library-actions { justify-content:flex-start; width:100%; }
      .file-row { grid-template-columns:40px minmax(0,1fr); }
      .fs-download-btn { grid-column:2; justify-self:start; margin-top:1px; }
      .qr-panel { grid-template-columns:1fr; }
      #qrCanvas { justify-self:start; }
      .fs-footer { align-items:flex-start; flex-direction:column; padding-inline:20px; }
    }
    @media (max-width:480px) {
      .content { padding:16px; }
      .topbar { padding-inline:16px; }
      .fs-library-actions > button { flex:1 1 auto; }
      .fs-library-actions .fs-refresh-btn { justify-content:center; }
      .fs-share-meta { gap:8px; }
      .fs-share-meta span + span { padding-left:8px; }
      .fs-transfer-status { align-items:flex-start; }
      .fs-transfer-actions { width:100%; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation:none!important; transition:none!important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main class="page" id="main-content" tabindex="-1">
    <section class="shell">
      <header class="topbar"><span class="brand">File Share</span><span>v{{VERSION}}</span></header>
      <div class="content">{{CONTENT}}</div>
      <div class="fs-footer">
        <span class="fs-footer-note">Temporary file access. Keep the link and password private.</span>
        <a class="fs-github-link" href="https://github.com/JCVERSA/file-share" target="_blank" rel="noopener noreferrer">File Share on GitHub</a>
      </div>
    </section>
  </main>
  <script src="/assets/qrcode-generator.js" integrity="sha512-6WOG76AXc8rlgtGYLGhDg7lIzZG2Cc+VrSamvgpeBYgxauGuoMua6uKll4OsZ0JvVSt12lRX/9uCmXzkt3/wfg==" nonce="{{NONCE}}"></script>
  <script nonce="{{NONCE}}">
  (() => {
    const app = {{APP_DATA}};
    const dashboard = document.querySelector('.dashboard');
    if (!dashboard) return;
    const state = {filter:'all',query:'',files:[],xhr:null,uploadXhr:null,activeLink:null};
    const $ = (id) => document.getElementById(id);
    const fileList = $('fileList'), emptyState = $('emptyState'), search = $('search'), progressCard = $('downloadProgress'), progressName = $('progressName'), progressValue = $('progressValue'), progressBar = $('progressBar'), progressStatus = $('progressStatus'), progressMeta = $('progressMeta'), transferAction = $('transferAction'), downloadComplete = $('downloadComplete'), downloadDone = $('downloadDone'), fileLoading = $('fileLoading'), fileLoadingText = $('fileLoadingText'), refreshFilesButton = $('refreshFiles'), uploadInput = $('uploadInput'), uploadButton = $('uploadFile'), uploadProgress = $('uploadProgress'), uploadName = $('uploadName'), uploadPercent = $('uploadPercent'), uploadBar = $('uploadBar'), uploadStatus = $('uploadStatus'), uploadMeta = $('uploadMeta');
    const escapeHtml = (value) => String(value).replace(/[&<>\'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const skeletonMarkup = () => { const variants=[['wide','medium'],['wide','short'],['medium','short']]; return variants.map(([a,b])=>`<div class="file-skeleton" aria-hidden="true"><div class="file-skeleton-icon"></div><div class="file-skeleton-main"><div class="file-skeleton-line ${a}"></div><div class="file-skeleton-line ${b}"></div></div><div class="file-skeleton-dot"></div></div>`).join(''); };
    const updateLoadingState = (loading, manual=false) => { fileLoading.hidden = !loading; fileList.setAttribute('aria-busy', loading ? 'true' : 'false'); if (loading) { fileLoadingText.textContent = manual ? 'Refreshing files' : 'Loading files'; emptyState.hidden = true; fileList.innerHTML = skeletonMarkup(); refreshFilesButton.classList.add('is-refreshing'); refreshFilesButton.disabled = true; refreshFilesButton.setAttribute('aria-busy','true'); refreshFilesButton.querySelector('span').textContent = manual ? 'Refreshing…' : 'Loading…'; } else { document.querySelectorAll('.file-skeleton').forEach((node) => node.remove()); refreshFilesButton.classList.remove('is-refreshing'); refreshFilesButton.disabled = false; refreshFilesButton.removeAttribute('aria-busy'); refreshFilesButton.querySelector('span').textContent = 'Refresh'; } };
    const downloadButton = (name, size) => `<a class="fs-download-btn" href="/download/${encodeURIComponent(name)}" data-download="${escapeHtml(name)}" data-size="${Number(size)}" download aria-label="Download ${escapeHtml(name)}">Download</a>`;
    const loadFiles = async ({manual=false}={}) => { const previousFiles = state.files.slice(); updateLoadingState(true, manual); try { const response = await fetch('/api/files',{cache:'no-store'}); if(response.status===401){window.location.href='/';return} if(!response.ok)throw new Error(`files: ${response.status}`); const payload=await response.json(); state.files=Array.isArray(payload.files)?payload.files:[]; renderFiles(); const statusResponse=await fetch('/api/status',{cache:'no-store'}); if(statusResponse.ok)updateStats(await statusResponse.json()); return true; } catch(error) { if(manual) { state.files=previousFiles; renderFiles(); } throw error; } finally { updateLoadingState(false, manual); } };
    const renderFiles = () => { const q=state.query.trim().toLowerCase(); const visible=state.files.filter((file)=>{const categoryOk=state.filter==='all'||file.category===state.filter; const queryOk=!q||file.name.toLowerCase().includes(q)||file.type.toLowerCase().includes(q); return categoryOk&&queryOk;}); fileList.innerHTML=visible.map((file)=>{const icon=escapeHtml((file.type||'FILE').slice(0,4).toUpperCase()); return `<div class="file-row" role="listitem"><span class="file-icon" aria-hidden="true">${icon}</span><span class="file-main"><strong>${escapeHtml(file.name)}</strong><span>${escapeHtml(file.type)}, ${escapeHtml(file.size_human)}, modified ${escapeHtml(file.mtime)}</span></span>${downloadButton(file.name,file.size)}</div>`;}).join(''); emptyState.textContent=state.files.length?'No files match your search and filters.':'No files are available in this share yet.'; emptyState.hidden=visible.length!==0; $('fileCount').textContent=String(visible.length); $('fileCountLabel').textContent=visible.length===1?'file':'files'; fileList.querySelectorAll('[data-download]').forEach((link)=>link.addEventListener('click',handleDownloadClick)); };
    const updateStats = (status) => { const bytes=status.bytes_total_human||'0 B', downloads=Number(status.downloads_total)||0, active=Number(status.active_downloads)||0; $('statsText').textContent=`${downloads.toLocaleString()} download${downloads===1?'':'s'}, ${bytes} transferred${active?`, ${active.toLocaleString()} active`:''}`; const remaining=status.remaining; $('shareState').textContent=(remaining===null||typeof remaining==='undefined')?(status.one_time?'Closes after first completed download':'No automatic expiry'):formatRemaining(remaining); };
    const formatRemaining = (seconds) => { seconds=Math.max(0,Number(seconds)||0); const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=Math.floor(seconds%60); if(h)return`Expires in ${h}h ${m}m`; if(m)return`Expires in ${m}m ${String(s).padStart(2,'0')}s`; return`Expires in ${s}s`; };
    const refreshStatus = async () => { try { const response=await fetch('/api/status',{cache:'no-store'}); if(response.status===401){window.location.href='/';return} if(response.status===410){window.location.reload();return} if(!response.ok)return; const status=await response.json(); updateStats(status); if(status.remaining===0)setTimeout(()=>window.location.reload(),500); } catch(_){} };
    const setDownloadState = (mode) => { if(mode==='active'){transferAction.hidden=false;downloadComplete.hidden=true;downloadDone.checked=false;transferAction.classList.add('is-active');transferAction.querySelector('span:last-child').textContent='Downloading';progressStatus.textContent='Downloading…';}else if(mode==='complete'){transferAction.hidden=true;downloadComplete.hidden=false;downloadDone.checked=true;progressStatus.textContent='Download complete';}else{transferAction.hidden=false;downloadComplete.hidden=true;downloadDone.checked=false;transferAction.classList.remove('is-active');progressStatus.textContent='Ready';} };
    const formatBytes = (bytes) => { const n=Number(bytes)||0; if(n<1024)return`${n} B`; if(n<1048576)return`${(n/1024).toFixed(1)} KB`; if(n<1073741824)return`${(n/1048576).toFixed(1)} MB`; return`${(n/1073741824).toFixed(1)} GB`; };
    const setProgress = (loaded,total,complete=false) => { const percent=complete?100:(total>0?Math.min(100,Math.round((loaded/total)*100)):0); progressValue.textContent=`${percent}%`; progressBar.style.width=`${percent}%`; progressBar.parentElement.setAttribute('aria-valuenow',String(percent)); progressMeta.textContent=`${formatBytes(loaded)} / ${formatBytes(total)}`; };
    const resetProgress = () => { if(state.xhr)state.xhr.abort(); state.xhr=null; progressCard.hidden=true; progressBar.style.width='0%'; progressValue.textContent='0%'; setDownloadState('reset'); if(state.activeLink){state.activeLink.classList.remove('is-downloading');state.activeLink.removeAttribute('aria-busy');state.activeLink=null;} };
    const handleDownloadClick = (event) => { const link=event.currentTarget, size=Number(link.dataset.size||0); if(!Number.isFinite(size)||size<0||size>app.progress_limit||(size===0&&!app.one_time))return; event.preventDefault(); if(state.xhr)resetProgress(); state.activeLink=link; link.classList.add('is-downloading'); link.setAttribute('aria-busy','true'); const name=link.dataset.download,href=link.getAttribute('href'); progressName.textContent=name; progressStatus.textContent='Starting download…'; progressMeta.textContent=`0 B / ${formatBytes(size)}`; setDownloadState('active'); setProgress(0,size); progressCard.hidden=false; const xhr=new XMLHttpRequest(); state.xhr=xhr; xhr.open('GET',href,true); xhr.responseType='blob'; xhr.onprogress=(e)=>setProgress(e.loaded,e.total||size); xhr.onload=()=>{ if(xhr.status!==200&&xhr.status!==206){progressStatus.textContent='Download failed';progressMeta.textContent=`Server returned HTTP ${xhr.status}`;setTimeout(resetProgress,1200);return} const disposition=xhr.getResponseHeader('Content-Disposition')||'',filenameMatch=disposition.match(/filename\*=UTF-8''([^;]+)/i),finalName=filenameMatch?decodeURIComponent(filenameMatch[1]):name,url=URL.createObjectURL(xhr.response); const a=document.createElement('a'); a.href=url; a.download=finalName; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); setProgress(size,size,true); setDownloadState('complete'); progressMeta.textContent=`${formatBytes(size)} · saved to your device`; setTimeout(resetProgress,1300); setTimeout(refreshStatus,500); if(app.one_time)setTimeout(()=>window.location.reload(),1500); }; xhr.onerror=()=>{progressStatus.textContent='Download failed';progressMeta.textContent='The transfer could not be completed';setTimeout(resetProgress,1200)}; xhr.onabort=()=>{state.xhr=null}; xhr.send(); };
    search.addEventListener('input',()=>{state.query=search.value;renderFiles()});
    document.querySelectorAll('[data-filter]').forEach((button)=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach((item)=>{item.classList.remove('active');item.setAttribute('aria-pressed','false')});button.classList.add('active');button.setAttribute('aria-pressed','true');state.filter=button.dataset.filter;renderFiles()}));
    $('refreshFiles').addEventListener('click',()=>{ loadFiles({manual:true}).catch(()=>{ refreshFilesButton.querySelector('span').textContent='Retry refresh'; setTimeout(()=>{ if(!refreshFilesButton.disabled) refreshFilesButton.querySelector('span').textContent='Refresh'; },1400); }); });
    $('cancelDownload').addEventListener('click',resetProgress);
    uploadButton.addEventListener('click',()=>{if(!uploadButton.disabled){uploadInput.value='';uploadInput.click()}});
    uploadInput.addEventListener('change',()=>{
      const file=uploadInput.files&&uploadInput.files[0];
      if(!file)return;
      if(file.size>app.max_upload_size){uploadProgress.hidden=false;uploadStatus.textContent='Upload not started';uploadMeta.textContent=`Maximum upload size is ${formatBytes(app.max_upload_size)}`;uploadInput.value='';return}
      uploadProgress.hidden=false;uploadName.textContent=file.name;uploadPercent.textContent='0%';uploadBar.style.width='0%';uploadBar.parentElement.setAttribute('aria-valuenow','0');uploadStatus.textContent='Uploading…';uploadMeta.textContent=`0 B / ${formatBytes(file.size)}`;uploadButton.disabled=true;
      const xhr=new XMLHttpRequest();state.uploadXhr=xhr;
      xhr.open('PUT',`/upload/${encodeURIComponent(file.name)}`,true);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.setRequestHeader('X-Requested-With','XMLHttpRequest');
      xhr.upload.onprogress=(event)=>{const loaded=event.loaded,total=event.total||file.size,percent=total?Math.min(100,Math.round(loaded/total*100)):100;uploadPercent.textContent=`${percent}%`;uploadBar.style.width=`${percent}%`;uploadBar.parentElement.setAttribute('aria-valuenow',String(percent));uploadMeta.textContent=`${formatBytes(loaded)} / ${formatBytes(total)}`};
      xhr.onload=async()=>{state.uploadXhr=null;uploadButton.disabled=false;uploadInput.value='';if(xhr.status===201){uploadPercent.textContent='100%';uploadBar.style.width='100%';uploadBar.parentElement.setAttribute('aria-valuenow','100');uploadStatus.textContent='Upload complete';uploadMeta.textContent=`${file.name} · ${formatBytes(file.size)}`;try{await loadFiles()}catch(_){uploadMeta.textContent='Upload complete; refresh the file list to see it'};setTimeout(()=>{uploadProgress.hidden=true},3500);return}if(xhr.status===401){window.location.href='/';return}let message=`Server returned HTTP ${xhr.status}`;try{message=JSON.parse(xhr.responseText).error||message}catch(_){}uploadStatus.textContent='Upload failed';uploadMeta.textContent=message};
      xhr.onerror=()=>{state.uploadXhr=null;uploadButton.disabled=false;uploadInput.value='';uploadStatus.textContent='Upload failed';uploadMeta.textContent='The connection was interrupted; refresh the list to check whether the file arrived'};
      xhr.onabort=()=>{state.uploadXhr=null;uploadButton.disabled=false;uploadInput.value='';uploadStatus.textContent='Upload canceled';uploadMeta.textContent='If the transfer had finished, the file may already be saved; refresh the list to check'};
      $('cancelUpload').onclick=()=>{if(state.uploadXhr)state.uploadXhr.abort()};xhr.send(file);
    });
    $('downloadAll').addEventListener('click',()=>{const button=$('downloadAll'),notice=$('bundleStatus');if(button.disabled)return;button.disabled=true;notice.hidden=false;notice.textContent='Preparing the ZIP. The dashboard stays available; check your browser downloads.';const frame=document.createElement('iframe');frame.name=`bundleDownload_${Date.now()}`;frame.title='Download all files';frame.hidden=true;frame.addEventListener('load',()=>{try{const body=(frame.contentDocument&&frame.contentDocument.body&&frame.contentDocument.body.innerText||'').trim();if(body){let message=body;try{message=JSON.parse(body).error||body}catch(_){}notice.textContent=message;button.disabled=false}}catch(_){}});document.body.appendChild(frame);const form=document.createElement('form');form.method='GET';form.action='/download-all';form.target=frame.name;form.hidden=true;document.body.appendChild(form);form.submit();form.remove();setTimeout(()=>{button.disabled=false;if(notice.textContent.startsWith('Preparing'))notice.textContent='Download request sent. If it did not start, check available space and retry.'},15000);setTimeout(()=>frame.remove(),120000)});
    $('copyLink').addEventListener('click',async(event)=>{const url=app.public_url||window.location.origin+'/';try{await navigator.clipboard.writeText(url);event.currentTarget.textContent='Copied';setTimeout(()=>event.currentTarget.textContent='Copy link',1200)}catch(_){window.prompt('Copy this link',url)}});
    $('showQr').addEventListener('click',(event)=>{const panel=$('qrPanel');panel.hidden=!panel.hidden;event.currentTarget.setAttribute('aria-expanded',String(!panel.hidden));if(panel.hidden)return;const canvas=$('qrCanvas'),url=app.public_url||window.location.origin+'/';try{if(typeof window.qrcode!=='function')throw new Error('QR code library did not load');const qr=window.qrcode(0,'M');qr.addData(url);qr.make();const count=qr.getModuleCount(),cell=Math.floor(canvas.width/(count+8)),offset=Math.floor((canvas.width-cell*count)/2),context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.fillStyle='#111317';for(let row=0;row<count;row++){for(let col=0;col<count;col++){if(qr.isDark(row,col))context.fillRect(offset+col*cell,offset+row*cell,cell,cell)}}$('qrStatus').textContent='The QR code contains only the public URL. The password is never embedded.'}catch(_){$('qrStatus').textContent='QR generation is unavailable in this browser.'}});
    $('stopShare').addEventListener('click', () => {
      if ($('stopConfirm')) return;
      const trigger = $('stopShare');
      const modal = document.createElement('div');
      modal.id = 'stopConfirm';
      modal.className = 'fs-confirm';
      modal.setAttribute('role', 'dialog');
      modal.setAttribute('aria-modal', 'true');
      modal.setAttribute('aria-labelledby', 'stopConfirmTitle');
      modal.setAttribute('aria-describedby', 'stopConfirmDescription');
      modal.setAttribute('tabindex', '-1');
      modal.innerHTML = `<div class="fs-confirm-card"><div class="eyebrow">Stop sharing</div><h2 id="stopConfirmTitle">End this public link?</h2><p id="stopConfirmDescription" class="muted">The Cloudflare URL will stop working immediately. The original files will not be deleted.</p><p id="stopStatus" class="muted" role="status" aria-live="polite"></p><div class="fs-confirm-actions"><button id="cancelStop" class="ghost" type="button">Cancel</button><button id="confirmStop" class="button fs-stop-btn" type="button">Stop share</button></div></div>`;
      document.body.appendChild(modal);
      const cancel = $('cancelStop'), confirm = $('confirmStop');
      cancel.focus();
      modal.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !confirm.disabled) {
          event.preventDefault();
          modal.remove();
          trigger.focus();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = Array.from(modal.querySelectorAll('button:not([disabled])'));
        if (!focusable.length) {
          event.preventDefault();
          modal.focus();
          return;
        }
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (!modal.contains(document.activeElement)) {
          event.preventDefault();
          first.focus();
        } else if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      cancel.addEventListener('click', () => {
        modal.remove();
        trigger.focus();
      });
      confirm.addEventListener('click', async () => {
        confirm.disabled = true;
        cancel.disabled = true;
        modal.setAttribute('aria-busy', 'true');
        modal.focus();
        try {
          const response = await fetch('/stop-share', {method:'POST', headers:{'X-Requested-With':'XMLHttpRequest'}});
          if (!response.ok) throw new Error('Stop share failed');
          modal.removeAttribute('aria-busy');
          modal.setAttribute('aria-labelledby', 'stopResultTitle');
          modal.removeAttribute('aria-describedby');
          modal.innerHTML = '<div class="fs-confirm-card"><div class="eyebrow">Share ended</div><h2 id="stopResultTitle">The public link is no longer active.</h2><p class="muted">The original files were not deleted.</p></div>';
          setTimeout(() => window.location.replace('/'), 900);
        } catch (_) {
          modal.removeAttribute('aria-busy');
          cancel.disabled = false;
          confirm.disabled = false;
          $('stopStatus').textContent = 'Could not stop sharing. Check the connection and try again.';
          confirm.focus();
        }
      });
    });
    loadFiles().catch(()=>{updateLoadingState(false);fileList.innerHTML='';emptyState.hidden=false;emptyState.textContent='Unable to load files. Refresh to try again.';});
    setInterval(refreshStatus,3000);
  })();
  </script>
