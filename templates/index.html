<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --panel: #101216;
      --panel2: #14171c;
      --panel3: #0d0f13;
      --border: #242831;
      --border-strong: #303640;
      --text: #f2f3f5;
      --muted: #8f97a4;
      --soft: #cbd0d8;
      --success: #8bd5ab;
      --danger: #d66f6f;
      --shadow: 0 16px 60px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.45; }
    a { color:inherit; text-decoration:none; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .page { width:min(1080px,calc(100% - 24px)); margin:0 auto; padding:24px 0 34px; }
    .shell { background:var(--panel); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
    .topbar { min-height:56px; padding:0 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; }
    .brand { color:var(--text); font-weight:700; letter-spacing:.025em; }
    .content { padding:26px; }
    .eyebrow { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-bottom:9px; }
    h1 { margin:0; font-size:clamp(30px,5vw,44px); line-height:1.03; letter-spacing:-.045em; }
    h2 { margin:0; font-size:20px; letter-spacing:-.025em; }
    .muted { color:var(--muted); }
    .hero { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:20px; }
    .fs-title-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .fs-hero-copy { min-width:0; }
    .hero .muted { margin:9px 0 0; font-size:13px; overflow-wrap:anywhere; }
    .fs-online { display:inline-flex; align-items:center; gap:7px; padding:7px 10px; border:1px solid var(--border); border-radius:999px; color:var(--soft); font-size:10px; font-weight:800; letter-spacing:.08em; }
    .status-dot { width:7px; height:7px; border-radius:999px; background:var(--success); flex:0 0 auto; box-shadow:0 0 0 3px rgba(139,213,171,.08); }
    .fs-header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .fs-share-card { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:16px; margin-bottom:14px; background:var(--panel3); border:1px solid var(--border); border-radius:15px; }
    .fs-share-copy { min-width:0; }
    .fs-share-url { color:var(--soft); font:12px ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .fs-share-meta { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; color:var(--muted); font-size:11px; }
    .fs-share-actions { display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end; }
    .toolbar { display:grid; gap:10px; padding:14px; background:var(--panel3); border:1px solid var(--border); border-radius:14px; margin-bottom:15px; }
    .search-wrap input { width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:10px; background:#090b0e; color:var(--text); outline:none; }
    .search-wrap input:focus { border-color:var(--border-strong); }
    .filter-group { display:flex; flex-wrap:wrap; gap:7px; }
    .filter,.ghost,.primary { border-radius:9px; padding:9px 12px; border:1px solid var(--border); font-weight:700; font-size:12px; transition:background .12s ease,border-color .12s ease,color .12s ease,transform .12s ease; }
    .filter { background:transparent; color:var(--muted); }
    .filter:hover,.ghost:hover { background:#191d23; border-color:var(--border-strong); color:var(--text); }
    .filter.active { background:#e8e9eb; border-color:#e8e9eb; color:#0f1114; }
    .primary { background:#e8e9eb; border-color:#e8e9eb; color:#0f1114; }
    .primary:hover { background:#fff; }
    .ghost { background:transparent; color:var(--soft); }
    .small { padding:7px 10px; }
    .fs-action-btn { min-width:88px; }
    .fs-lock-btn { padding:8px 12px; }
    .fs-library-head { display:flex; justify-content:space-between; align-items:center; gap:15px; margin:8px 0 12px; }
    .fs-library-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    /* Refresh control based on the supplied component, fully scoped to File Share. */
    .fs-refresh-btn { font-family:inherit; font-size:12px; background:#222; color:#fff; fill:#9b9999; padding:9px 14px 9px 11px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:1px solid #2f3339; border-radius:10px; font-weight:800; min-height:40px; transition:background .2s ease,border-color .2s ease,transform .15s ease,opacity .2s ease; }
    .fs-refresh-btn:hover { background:#333; border-color:#3b4048; }
    .fs-refresh-btn:active { transform:scale(.97); }
    .fs-refresh-btn:disabled { cursor:wait; opacity:.7; }
    .fs-refresh-btn svg { display:block; width:20px; height:20px; margin-right:1px; color:#fff; transform-origin:center center; transition:transform .3s ease; }
    .fs-refresh-btn.is-refreshing svg { animation:fs_spin_357 .5s linear infinite; }
    @keyframes fs_spin_357 { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    .fs-library-title { font-size:13px; color:var(--soft); }
    .fs-library-title strong { color:var(--text); font-size:16px; }
    .file-list { border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .file-row { position:relative; display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:13px; align-items:center; padding:14px; background:var(--panel2); border-bottom:1px solid var(--border); }
    .file-row:last-child { border-bottom:0; }
    .file-row:hover { background:#171a20; }
    .file-icon { width:36px; height:36px; border-radius:9px; border:1px solid var(--border); display:grid; place-items:center; color:var(--soft); font-size:9px; font-weight:800; letter-spacing:.04em; overflow:hidden; }
    .file-main { min-width:0; }
    .file-main strong { display:block; font-size:14px; font-weight:700; overflow-wrap:anywhere; }
    .file-main span { display:block; color:var(--muted); font-size:11px; margin-top:3px; overflow-wrap:anywhere; }

    .fs-download-btn,.fs-download-btn * { box-sizing:border-box; }
    .fs-download-btn { position:relative; display:inline-grid; place-content:center; min-width:122px; min-height:42px; padding:0 17px; border:1px solid var(--border-strong); border-radius:999px; overflow:hidden; background:transparent; color:var(--text); font-size:11px; font-weight:900; letter-spacing:.05em; text-transform:uppercase; }
    .fs-download-btn .original { background:#e8e9eb; color:#101215; display:grid; inset:0; place-content:center; position:absolute; transition:transform .2s cubic-bezier(.87,0,.13,1); }
    .fs-download-btn:hover .original { transform:translateY(100%); }
    .fs-download-btn .letters { display:inline-flex; position:relative; z-index:2; }
    .fs-download-btn .letters span { opacity:0; transform:translateY(-15px); transition:transform .2s cubic-bezier(.87,0,.13,1),opacity .2s; }
    .fs-download-btn .letters span:nth-child(2n) { transform:translateY(15px); }
    .fs-download-btn:hover .letters span { opacity:1; transform:translateY(0); }
    .fs-download-btn:hover .letters span:nth-child(2){transition-delay:.04s}.fs-download-btn:hover .letters span:nth-child(3){transition-delay:.08s}.fs-download-btn:hover .letters span:nth-child(4){transition-delay:.12s}.fs-download-btn:hover .letters span:nth-child(5){transition-delay:.16s}.fs-download-btn:hover .letters span:nth-child(6){transition-delay:.20s}.fs-download-btn:hover .letters span:nth-child(7){transition-delay:.24s}.fs-download-btn:hover .letters span:nth-child(8){transition-delay:.28s}
    .fs-download-btn:active { transform:scale(.98); }

    .fs-loading { display:flex; justify-content:center; padding:15px 0 10px; }
    .fs-loader { width:150px; height:42px; position:relative; }
    .fs-loader-text { position:absolute; top:0; left:0; padding:0; margin:0; color:#aeb5bf; animation:fs_text_loader 3.5s ease both infinite; font-size:.72rem; letter-spacing:1px; }
    .fs-load { background:#9da6b2; border-radius:50px; display:block; height:10px; width:10px; bottom:0; position:absolute; transform:translateX(106px); animation:fs_loading 3.5s ease both infinite; }
    .fs-load::before { position:absolute; content:""; width:100%; height:100%; background:#d5d9df; border-radius:inherit; animation:fs_loading2 3.5s ease both infinite; }
    @keyframes fs_text_loader {0%{letter-spacing:1px;transform:translateX(0)}40%{letter-spacing:2px;transform:translateX(24px)}80%{letter-spacing:1px;transform:translateX(35px)}90%{letter-spacing:2px;transform:translateX(0)}100%{letter-spacing:1px;transform:translateX(0)}}
    @keyframes fs_loading {0%{width:10px;transform:translateX(0)}40%{width:100%;transform:translateX(0)}80%{width:10px;transform:translateX(106px)}90%{width:100%;transform:translateX(0)}100%{width:10px;transform:translateX(0)}}
    @keyframes fs_loading2 {0%{transform:translateX(0);width:10px}40%{transform:translateX(0);width:80%}80%{width:100%;transform:translateX(0)}90%{width:80%;transform:translateX(15px)}100%{transform:translateX(0);width:10px}}

    .file-skeleton { position:relative; display:grid; grid-template-columns:44px minmax(0,1fr) 12px; gap:13px; align-items:center; padding:14px; border-bottom:1px solid var(--border); background:var(--panel2); animation:fs_pulse 1.5s ease-in-out infinite; }
    .file-skeleton:last-child { border-bottom:0; }
    .file-skeleton-icon { width:36px; height:36px; border-radius:9px; background:#282d35; }
    .file-skeleton-main { min-width:0; }.file-skeleton-line { height:10px; background:#282d35; border-radius:999px; margin:4px 0; }.file-skeleton-line.wide{width:56%}.file-skeleton-line.medium{width:42%}.file-skeleton-line.short{width:32%}.file-skeleton-dot{width:8px;height:8px;border-radius:50%;background:#282d35;justify-self:end}
    @keyframes fs_pulse {0%,100%{opacity:.62}50%{opacity:1}}

    /* Download-state button, scoped from the supplied animated SVG button. */
    .fs-transfer-btn { font-family:inherit; font-size:12px; background:#15181d; color:#fff; fill:#9b9999; padding:9px 12px 9px 10px; display:inline-flex; align-items:center; gap:6px; cursor:default; border:1px solid var(--border); border-radius:12px; font-weight:900; min-width:150px; justify-content:flex-start; overflow:hidden; transition:background .3s ease,border-color .3s ease,transform .15s ease; }
    .fs-transfer-btn .fs-svg-wrapper { display:inline-flex; align-items:center; justify-content:center; width:24px; min-width:24px; transition:transform .45s ease; }
    .fs-transfer-btn svg { width:20px; height:20px; display:block; transform-origin:center center; transition:transform .45s ease,fill .3s ease; }
    .fs-transfer-btn.is-active .fs-svg-wrapper { animation:fs_transfer_bob .75s ease-in-out infinite alternate; }
    .fs-transfer-btn.is-active svg { fill:#fff; }
    @keyframes fs_transfer_bob { from{transform:translateY(1px)} to{transform:translateY(-2px)} }

    /* Completion checkbox, scoped from the supplied checkbox component. */
    .fs-checkbox { --checkbox-color:#e8e9eb; --checkbox-size:1.35rem; display:inline-flex; align-items:center; position:relative; cursor:default; user-select:none; font-size:var(--checkbox-size); font-weight:700; color:var(--checkbox-color); }
    .fs-checkbox input { position:absolute; pointer-events:none; inset:0; opacity:0; }
    .fs-checkbox .checkmark { display:flex; align-items:center; gap:8px; opacity:.68; transition:opacity 150ms ease; }
    .fs-checkbox input:checked ~ .checkmark { opacity:1; }
    .fs-checkbox .checkmark svg { width:var(--checkbox-size); height:var(--checkbox-size); }
    .fs-checkbox .checkmark svg rect { stroke-dasharray:88 0; stroke-dashoffset:73; transition:stroke-dasharray 180ms ease; }
    .fs-checkbox input:checked ~ .checkmark svg rect { stroke-dasharray:80 18; }
    .fs-checkbox .checkmark svg polyline { stroke-dasharray:0 30; stroke-dashoffset:1; transition:stroke-dasharray 180ms ease; }
    .fs-checkbox input:checked ~ .checkmark svg polyline { stroke-dasharray:30 30; }
    .fs-transfer-status { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:10px; }
    .fs-transfer-copy { min-width:0; }
    .fs-transfer-copy strong { display:block; font-size:12px; }
    .fs-transfer-copy span { display:block; color:var(--muted); font-size:10px; margin-top:3px; }
    .fs-transfer-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    /* Supplied 3D loader, scoped and recolored to match the neutral dashboard. */
    .fs-stage-loading { position:relative; min-height:176px; display:grid; place-items:center; overflow:hidden; }
    .fs-3d-loader { --fs-duration:3s; --fs-primary:#8f97a4; --fs-primary-light:#cbd0d8; --fs-primary-rgba:rgba(203,208,216,0); width:200px; height:160px; position:relative; transform-style:preserve-3d; transform:scale(.42); transform-origin:center center; margin:-34px 0; }
    .fs-3d-loader:before,.fs-3d-loader:after{--r:20.5deg;content:"";width:320px;height:140px;position:absolute;right:32%;bottom:-11px;background:#12151a;transform:translateZ(200px) rotate(var(--r));animation:fs3d_mask var(--fs-duration) linear forwards infinite}
    .fs-3d-loader:after{--r:-20.5deg;right:auto;left:32%}

    .fs-3d-loader .ground div{transform:rotateX(90deg) rotateY(0deg) translate(-48px,-120px) translateZ(100px) scale(0);width:200px;height:200px;background:var(--fs-primary);background:linear-gradient(45deg,var(--fs-primary) 0%,var(--fs-primary) 50%,var(--fs-primary-light) 50%,var(--fs-primary-light) 100%);transform-style:preserve-3d;animation:fs3d_ground var(--fs-duration) linear forwards infinite}
    .fs-3d-loader .ground div:before,.fs-3d-loader .ground div:after{--rx:90deg;--ry:0deg;--x:44px;--y:162px;--z:-50px;content:"";width:156px;height:300px;opacity:0;background:linear-gradient(var(--fs-primary),var(--fs-primary-rgba));position:absolute;transform:rotateX(var(--rx)) rotateY(var(--ry)) translate(var(--x),var(--y)) translateZ(var(--z));animation:fs3d_ground_shine var(--fs-duration) linear forwards infinite}
    .fs-3d-loader .ground div:after{--ry:90deg;--x:0;--y:177px;--z:150px}
    .fs-3d-loader .box{--x:0;--y:0;position:absolute;animation:var(--fs-duration) linear forwards infinite;transform:translate(var(--x),var(--y))}
    .fs-3d-loader .box div{background-color:var(--fs-primary);width:48px;height:48px;position:relative;transform-style:preserve-3d;animation:var(--fs-duration) ease forwards infinite;transform:rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0)}
    .fs-3d-loader .box div:before,.fs-3d-loader .box div:after{--rx:90deg;--ry:0deg;--z:24px;--y:-24px;--x:0;content:"";position:absolute;background-color:inherit;width:inherit;height:inherit;transform:rotateX(var(--rx)) rotateY(var(--ry)) translate(var(--x),var(--y)) translateZ(var(--z));filter:brightness(var(--b,1.2))}
    .fs-3d-loader .box div:after{--rx:0deg;--ry:90deg;--x:24px;--y:0;--b:1.35}

    .fs-3d-loader .box0{animation-name:fs3d_move0}.fs-3d-loader .box0 div{animation-name:fs3d_scale0}.fs-3d-loader .box1{animation-name:fs3d_move1}.fs-3d-loader .box1 div{animation-name:fs3d_scale1}.fs-3d-loader .box2{animation-name:fs3d_move2}.fs-3d-loader .box2 div{animation-name:fs3d_scale2}.fs-3d-loader .box3{animation-name:fs3d_move3}.fs-3d-loader .box3 div{animation-name:fs3d_scale3}.fs-3d-loader .box4{animation-name:fs3d_move4}.fs-3d-loader .box4 div{animation-name:fs3d_scale4}.fs-3d-loader .box5{animation-name:fs3d_move5}.fs-3d-loader .box5 div{animation-name:fs3d_scale5}.fs-3d-loader .box6{animation-name:fs3d_move6}.fs-3d-loader .box6 div{animation-name:fs3d_scale6}.fs-3d-loader .box7{animation-name:fs3d_move7}.fs-3d-loader .box7 div{animation-name:fs3d_scale7}

    .animated-button.fs-animated-button { position:relative; display:inline-block; padding:12px 24px; border:none; font-size:12px; background:#15181d; border-radius:100px; font-weight:700; color:#ffffff70; box-shadow:0 0 0 1px var(--border-strong); cursor:pointer; overflow:hidden; transition:all .6s cubic-bezier(.23,1,.32,1); min-width:132px; }
    .animated-button.fs-animated-button span:last-child{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background:#7e8793;border-radius:50%;opacity:0;transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button.fs-animated-button span:first-child{position:relative;z-index:1}.animated-button.fs-animated-button:hover{box-shadow:0 0 0 4px rgba(126,135,147,.12);color:#fff}.animated-button.fs-animated-button:active{transform:scale(.97)}.animated-button.fs-animated-button:hover span:last-child{width:150px;height:150px;opacity:1}

    .button.fs-stop-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;background:#16181d;border:1px solid var(--border);font:inherit;color:#e8e8e8;font-size:12px;font-weight:700;border-radius:50px;cursor:pointer;overflow:hidden;transition:all .3s cubic-bezier(.23,1,.32,1)}
    .button.fs-stop-btn span{position:relative;z-index:2;display:flex;align-items:center}.button.fs-stop-btn::before{position:absolute;content:"";width:100%;height:100%;translate:0 105%;background:var(--danger);transition:all .3s cubic-bezier(.23,1,.32,1)}.button.fs-stop-btn:hover{animation:fs_shake .2s linear 1;border-color:var(--danger)}.button.fs-stop-btn:hover::before{translate:0 0}.fs-stop-icon{font-size:17px;line-height:1;color:var(--danger)}
    @keyframes fs_shake{0%{rotate:0deg}33%{rotate:4deg}66%{rotate:-4deg}100%{rotate:0deg}}

    .progress-card{margin:14px 0;padding:14px;border:1px solid var(--border);background:var(--panel3);border-radius:12px}.progress-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:8px}.progress-track{height:7px;background:#20242b;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:#dfe1e5;transition:width .12s linear}.progress-card .small{margin-top:10px}
    .qr-panel{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:16px;margin-bottom:16px;border:1px solid var(--border);background:var(--panel3);border-radius:14px}#qrCanvas{width:min(220px,45vw);height:auto;background:#fff;padding:8px;border-radius:8px;justify-self:end}.empty{padding:30px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);text-align:center}

    .fs-github-btn{transform:rotate(-25deg) skew(25deg);transform-style:preserve-3d;position:relative;display:block;width:100px;height:32px;border:none;background:transparent;cursor:pointer;margin-left:auto}.fs-github-btn::before{content:"";position:absolute;bottom:-10px;left:-5px;width:100%;height:10px;background:#2a2a2a;transform:skewX(-41deg)}.fs-github-btn::after{content:"";position:absolute;top:5px;left:-9px;width:9px;height:100%;background:#2a2a2a;transform:skewY(-49deg)}.fs-github-btn span{position:absolute;top:0;left:0;width:100%;height:100%;display:grid;place-items:center;background:#2a2a2a;color:#fff;font-size:12px;font-weight:800;transition:.7s ease-out}.fs-github-btn:hover span{z-index:1000;transition:.25s}.fs-github-btn:hover span:nth-child(5){transform:translate(40px,-40px);opacity:1}.fs-github-btn:hover span:nth-child(4){transform:translate(30px,-30px);opacity:.8}.fs-github-btn:hover span:nth-child(3){transform:translate(20px,-20px);opacity:.6}.fs-github-btn:hover span:nth-child(2){transform:translate(10px,-10px);opacity:.4}.fs-github-btn:hover span:nth-child(1){transform:translate(0,0);opacity:.2}.fs-github-btn:active span:nth-child(5){transform:translate(20px,-20px);opacity:1}.fs-github-btn:active span:nth-child(4){transform:translate(15px,-15px)}.fs-github-btn:active span:nth-child(3){transform:translate(10px,-10px)}.fs-github-btn:active span:nth-child(2){transform:translate(5px,-5px)}.fs-github-btn:active span:nth-child(1){transform:translate(0,0)}.fs-github-btn:hover span{background:#303236}
    .fs-footer{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:15px 18px 2px}.fs-footer-note{color:#666e79;font-size:10px}
    .fs-confirm{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);padding:20px;z-index:1000}.fs-confirm-card{width:min(420px,100%);padding:20px;border:1px solid var(--border-strong);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}.fs-confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

    .auth-card{width:min(450px,100%);margin:52px auto}.auth-card p{margin:10px 0 0;font-size:13px}.auth-form{margin-top:23px;display:grid;gap:9px}label{font-size:12px;color:var(--soft)}.auth-form input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:11px;background:#090b0e;color:var(--text);outline:none}.auth-form input:focus{border-color:var(--border-strong)}.auth-form button{margin-top:7px;padding:12px 15px;border:0;border-radius:10px;background:#e8e9eb;color:#101215;font-weight:800}.back{display:inline-block;margin-top:17px;color:var(--soft);font-size:12px}
    footer{text-align:center;color:#666e79;font-size:10px;padding:13px 0 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
    @media (max-width:760px){.page{width:min(100% - 12px,1080px);padding-top:8px}.content{padding:18px}.hero,.fs-share-card{flex-direction:column;align-items:stretch}.fs-header-actions,.fs-share-actions{justify-content:flex-start}.fs-library-head{align-items:flex-start;flex-direction:column}.fs-library-actions{justify-content:flex-start;width:100%}.fs-download-btn{min-width:116px}.file-row{grid-template-columns:40px minmax(0,1fr)}.fs-download-btn{grid-column:2;justify-self:start;margin-top:1px}.qr-panel{grid-template-columns:1fr}#qrCanvas{justify-self:start}.fs-footer{align-items:flex-start;flex-direction:column}.fs-github-btn{margin-left:0}}
    @media (max-width:480px){.fs-3d-loader{transform:scale(.34)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fs-3d-loader{display:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <header class="topbar"><span class="brand">File Share</span><span>v{{VERSION}}</span></header>
      <div class="content">{{CONTENT}}</div>
      <div class="fs-footer">
        <span class="fs-footer-note">Temporary access · keep the URL and password private</span>
        <a class="fs-github-btn" href="https://github.com/JCVERSA/file-share" target="_blank" rel="noopener noreferrer" aria-label="Open File Share on GitHub"><span>GitHub</span><span>GitHub</span><span>GitHub</span><span>GitHub</span><span>GitHub</span></a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" nonce="{{NONCE}}"></script>
  <script nonce="{{NONCE}}">
  (() => {
    const app = {{APP_DATA}};
    const dashboard = document.querySelector('.dashboard');
    if (!dashboard) return;
    const state = {filter:'all',query:'',files:[],xhr:null,activeLink:null};
    const $ = (id) => document.getElementById(id);
    const fileList = $('fileList'), emptyState = $('emptyState'), search = $('search'), progressCard = $('downloadProgress'), progressName = $('progressName'), progressValue = $('progressValue'), progressBar = $('progressBar'), progressStatus = $('progressStatus'), progressMeta = $('progressMeta'), transferAction = $('transferAction'), downloadComplete = $('downloadComplete'), downloadDone = $('downloadDone'), fileLoading = $('fileLoading'), fileLoadingText = $('fileLoadingText'), refreshFilesButton = $('refreshFiles');
    const escapeHtml = (value) => String(value).replace(/[&<>\'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const skeletonMarkup = () => { const variants=[['wide','medium'],['wide','short'],['medium','short']]; return variants.map(([a,b])=>`<div class="file-skeleton" aria-hidden="true"><div class="file-skeleton-icon"></div><div class="file-skeleton-main"><div class="file-skeleton-line ${a}"></div><div class="file-skeleton-line ${b}"></div></div><div class="file-skeleton-dot"></div></div>`).join(''); };
    const updateLoadingState = (loading, manual=false) => { fileLoading.hidden = !loading; fileList.setAttribute('aria-busy', loading ? 'true' : 'false'); if (loading) { fileLoadingText.textContent = manual ? 'Refreshing files' : 'Loading files'; fileList.innerHTML = skeletonMarkup(); refreshFilesButton.classList.add('is-refreshing'); refreshFilesButton.disabled = true; refreshFilesButton.setAttribute('aria-busy','true'); refreshFilesButton.querySelector('span').textContent = manual ? 'Refreshing…' : 'Loading…'; } else { document.querySelectorAll('.file-skeleton').forEach((node) => node.remove()); refreshFilesButton.classList.remove('is-refreshing'); refreshFilesButton.disabled = false; refreshFilesButton.removeAttribute('aria-busy'); refreshFilesButton.querySelector('span').textContent = 'Refresh'; } };
    const downloadButton = (name, size) => { const letters = 'Download'.split('').map((letter) => `<span>${escapeHtml(letter)}</span>`).join(''); return `<a class="fs-download-btn" href="/download/${encodeURIComponent(name)}" data-download="${escapeHtml(name)}" data-size="${Number(size)}" download aria-label="Download ${escapeHtml(name)}"><span class="original">Download</span><span class="letters">${letters}</span></a>`; };
    const loadFiles = async ({manual=false}={}) => { const previousFiles = state.files.slice(); updateLoadingState(true, manual); try { const response = await fetch('/api/files',{cache:'no-store'}); if(response.status===401){window.location.href='/';return} if(!response.ok)throw new Error(`files: ${response.status}`); const payload=await response.json(); state.files=Array.isArray(payload.files)?payload.files:[]; renderFiles(); const statusResponse=await fetch('/api/status',{cache:'no-store'}); if(statusResponse.ok)updateStats(await statusResponse.json()); return true; } catch(error) { if(manual) { state.files=previousFiles; renderFiles(); } throw error; } finally { updateLoadingState(false, manual); } };
    const renderFiles = () => { const q=state.query.trim().toLowerCase(); const visible=state.files.filter((file)=>{const categoryOk=state.filter==='all'||file.category===state.filter; const queryOk=!q||file.name.toLowerCase().includes(q)||file.type.toLowerCase().includes(q); return categoryOk&&queryOk;}); fileList.innerHTML=visible.map((file)=>{const icon=escapeHtml((file.type||'FILE').slice(0,4).toUpperCase()); return `<div class="file-row"><span class="file-icon">${icon}</span><span class="file-main"><strong>${escapeHtml(file.name)}</strong><span>${escapeHtml(file.type)} · ${escapeHtml(file.size_human)} · ${escapeHtml(file.mtime)}</span></span>${downloadButton(file.name,file.size)}</div>`;}).join(''); emptyState.hidden=visible.length!==0; $('fileCount').textContent=String(visible.length); fileList.querySelectorAll('[data-download]').forEach((link)=>link.addEventListener('click',handleDownloadClick)); };
    const updateStats = (status) => { const bytes=status.bytes_total_human||'0 B'; $('statsText').textContent=`${status.downloads_total||0} downloads · ${bytes} transferred${status.active_downloads?` · ${status.active_downloads} active`:''}`; const remaining=status.remaining; $('shareState').textContent=(remaining===null||typeof remaining==='undefined')?(status.one_time?'Closes after first completed download':'No automatic expiry'):formatRemaining(remaining); };
    const formatRemaining = (seconds) => { seconds=Math.max(0,Number(seconds)||0); const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=Math.floor(seconds%60); if(h)return`Expires in ${h}h ${m}m`; if(m)return`Expires in ${m}m ${String(s).padStart(2,'0')}s`; return`Expires in ${s}s`; };
    const refreshStatus = async () => { try { const response=await fetch('/api/status',{cache:'no-store'}); if(response.status===401){window.location.href='/';return} if(!response.ok)return; const status=await response.json(); updateStats(status); if(status.remaining===0)setTimeout(()=>window.location.reload(),500); } catch(_){} };
    const setDownloadState = (mode) => { if(mode==='active'){transferAction.hidden=false;downloadComplete.hidden=true;downloadDone.checked=false;transferAction.classList.add('is-active');transferAction.querySelector('span:last-child').textContent='Downloading';progressStatus.textContent='Downloading…';}else if(mode==='complete'){transferAction.hidden=true;downloadComplete.hidden=false;downloadDone.checked=true;progressStatus.textContent='Download complete';}else{transferAction.hidden=false;downloadComplete.hidden=true;downloadDone.checked=false;transferAction.classList.remove('is-active');progressStatus.textContent='Ready';} };
    const formatBytes = (bytes) => { const n=Number(bytes)||0; if(n<1024)return`${n} B`; if(n<1048576)return`${(n/1024).toFixed(1)} KB`; if(n<1073741824)return`${(n/1048576).toFixed(1)} MB`; return`${(n/1073741824).toFixed(1)} GB`; };
    const setProgress = (loaded,total) => { const percent=total>0?Math.min(100,Math.round((loaded/total)*100)):0; progressValue.textContent=`${percent}%`; progressBar.style.width=`${percent}%`; progressMeta.textContent=`${formatBytes(loaded)} / ${formatBytes(total)}`; };
    const resetProgress = () => { if(state.xhr)state.xhr.abort(); state.xhr=null; progressCard.hidden=true; progressBar.style.width='0%'; progressValue.textContent='0%'; setDownloadState('reset'); if(state.activeLink){state.activeLink.classList.remove('is-downloading');state.activeLink.removeAttribute('aria-busy');state.activeLink=null;} };
    const handleDownloadClick = (event) => { const link=event.currentTarget, size=Number(link.dataset.size||0); if(!Number.isFinite(size)||size<=0||size>app.progress_limit)return; event.preventDefault(); if(state.xhr)resetProgress(); state.activeLink=link; link.classList.add('is-downloading'); link.setAttribute('aria-busy','true'); const name=link.dataset.download,href=link.getAttribute('href'); progressName.textContent=name; progressStatus.textContent='Starting download…'; progressMeta.textContent=`0 B / ${formatBytes(size)}`; setDownloadState('active'); setProgress(0,size); progressCard.hidden=false; const xhr=new XMLHttpRequest(); state.xhr=xhr; xhr.open('GET',href,true); xhr.responseType='blob'; xhr.onprogress=(e)=>setProgress(e.loaded,e.total||size); xhr.onload=()=>{ if(xhr.status!==200&&xhr.status!==206){progressStatus.textContent='Download failed';progressMeta.textContent=`Server returned HTTP ${xhr.status}`;setTimeout(resetProgress,1200);return} const disposition=xhr.getResponseHeader('Content-Disposition')||'',filenameMatch=disposition.match(/filename\*=UTF-8''([^;]+)/i),finalName=filenameMatch?decodeURIComponent(filenameMatch[1]):name,url=URL.createObjectURL(xhr.response); const a=document.createElement('a'); a.href=url; a.download=finalName; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); setProgress(size,size); setDownloadState('complete'); progressMeta.textContent=`${formatBytes(size)} · saved to your device`; setTimeout(resetProgress,1300); setTimeout(refreshStatus,500); if(app.one_time)setTimeout(()=>window.location.reload(),1500); }; xhr.onerror=()=>{progressStatus.textContent='Download failed';progressMeta.textContent='The transfer could not be completed';setTimeout(resetProgress,1200)}; xhr.onabort=()=>{state.xhr=null}; xhr.send(); };
    search.addEventListener('input',()=>{state.query=search.value;renderFiles()});
    document.querySelectorAll('[data-filter]').forEach((button)=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach((item)=>item.classList.remove('active'));button.classList.add('active');state.filter=button.dataset.filter;renderFiles()}));
    $('refreshFiles').addEventListener('click',()=>{ loadFiles({manual:true}).catch(()=>{ refreshFilesButton.querySelector('span').textContent='Retry refresh'; setTimeout(()=>{ if(!refreshFilesButton.disabled) refreshFilesButton.querySelector('span').textContent='Refresh'; },1400); }); });
    $('cancelDownload').addEventListener('click',resetProgress);
    $('downloadAll').addEventListener('click',()=>{ if(document.getElementById('archiveOverlay'))return; const overlay=document.createElement('div'); overlay.id='archiveOverlay'; overlay.className='fs-archive-overlay'; overlay.innerHTML=`<div class="fs-archive-card"><div class="eyebrow">PREPARING ARCHIVE</div><div class="fs-stage-loading"><div class="fs-3d-loader" aria-hidden="true"><div class="ground"><div></div></div><div class="box box0"><div></div></div><div class="box box1"><div></div></div><div class="box box2"><div></div></div><div class="box box3"><div></div></div><div class="box box4"><div></div></div><div class="box box5"><div></div></div><div class="box box6"><div></div></div><div class="box box7"><div></div></div></div></div><h2>Creating files.zip</h2><p class="muted">Collecting the shared files. This may take a moment.</p></div>`; document.body.appendChild(overlay); window.location.href='/download-all'; });
    $('copyLink').addEventListener('click',async(event)=>{const url=app.public_url||window.location.origin+'/';try{await navigator.clipboard.writeText(url);event.currentTarget.textContent='Copied';setTimeout(()=>event.currentTarget.textContent='Copy link',1200)}catch(_){window.prompt('Copy this link',url)}});
    $('showQr').addEventListener('click',async()=>{const panel=$('qrPanel');panel.hidden=!panel.hidden;if(panel.hidden)return;const canvas=$('qrCanvas'),url=app.public_url||window.location.origin+'/';if(window.QRCode&&typeof window.QRCode.toCanvas==='function'){try{await window.QRCode.toCanvas(canvas,url,{errorCorrectionLevel:'M',margin:1,width:220,color:{dark:'#111317',light:'#ffffff'}})}catch(_){}}});
    $('stopShare').addEventListener('click',()=>{if(document.getElementById('stopConfirm'))return;const modal=document.createElement('div');modal.id='stopConfirm';modal.className='fs-confirm';modal.innerHTML=`<div class="fs-confirm-card"><div class="eyebrow">STOP SHARE</div><h2>End this public link?</h2><p class="muted">The Cloudflare URL will stop working immediately. The original files will not be deleted.</p><div class="fs-confirm-actions"><button id="cancelStop" class="ghost" type="button">Cancel</button><button id="confirmStop" class="button fs-stop-btn" type="button"><span>Stop share</span></button></div></div>`;document.body.appendChild(modal);$('cancelStop').focus();$('cancelStop').addEventListener('click',()=>modal.remove());$('confirmStop').addEventListener('click',async()=>{const button=$('confirmStop');button.disabled=true;button.querySelector('span').textContent='Stopping…';try{const response=await fetch('/stop-share',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}});if(response.ok){modal.innerHTML='<div class="fs-confirm-card"><div class="eyebrow">STOPPED</div><h2>Share ended</h2><p class="muted">The public link is no longer active.</p></div>';setTimeout(()=>window.location.replace('/'),900)}else{button.disabled=false;button.querySelector('span').textContent='Stop share'}}catch(_){button.disabled=false;button.querySelector('span').textContent='Stop share'}}); });
    loadFiles().catch(()=>{updateLoadingState(false);fileList.innerHTML='';emptyState.hidden=false;emptyState.textContent='Unable to load files. Refresh to try again.';});
    setInterval(refreshStatus,3000);
  })();
  </script>
</body>
